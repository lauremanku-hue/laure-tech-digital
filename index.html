<style>
  :root {
    --ink: #0A2342;        /* bleu nuit : confiance, sérieux */
    --ink-2: #123763;
    --muted: #4A5A78;
    --paper: #F5F8FC;
    --white: #FFFFFF;
    --line: #DCE4F0;
    --accent: #1559E6;     /* bleu électrique : technologie */
    --accent-ink: #FFFFFF;
    --green: #22C55E;      /* vert : innovation, croissance */
    --green-ink: #0A7D4F;  /* vert lisible pour le texte */
    --on-dark: #B9C6DE;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* Barre du haut */
  .bar { background: var(--white); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 72px; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 42px; height: 42px; flex: none; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text strong { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
  .brand-text small { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--green-ink); }
  .refresh {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 999px;
    font: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
  }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .refresh:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .refresh:disabled { cursor: progress; opacity: .7; }
  .refresh svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .refresh.loading svg { animation: tourne .8s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .status { margin: 0; padding-top: 6px; text-align: right; color: var(--muted); font-size: .8rem; }
  .status:empty { display: none; }

  /* Présentation */
  .hero { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 64px 0 8px; align-items: center; }
  h1 { margin: 0 0 16px; max-width: 18ch; font-size: clamp(2.1rem, 6vw, 3.6rem); line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; }
  .lead { margin: 0; max-width: 56ch; color: var(--muted); font-size: 1.1rem; }
  .deco { display: none; width: 100%; height: auto; }
  .atouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); }
  .atouts strong { display: block; font-size: 1.05rem; letter-spacing: -0.01em; }
  .atouts p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }

  /* Sections */
  section { margin-top: 80px; }
  h2 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -0.03em; }
  .intro { margin: 0; max-width: 56ch; color: var(--muted); }

  /* Boutons */
  .btn {
    display: inline-flex; align-items: center; align-self: flex-start; gap: 10px;
    margin-top: 18px; padding: 12px 20px;
    background: var(--accent); color: var(--accent-ink);
    border: 1.5px solid var(--accent);
    font: inherit; font-weight: 600; text-decoration: none; border-radius: 10px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn.alt { background: transparent; color: var(--ink); border-color: var(--ink); }
  .btn.alt:hover { filter: none; color: var(--accent); border-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 0 12px; }

  /* Solutions : diaporama sur fond bleu nuit */
  .bande { margin-top: 80px; padding: 64px 0 56px; background: var(--ink); color: var(--white); }
  .bande h2 { color: var(--white); }
  .bande .intro { color: var(--on-dark); }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .head > div:first-child { flex: 1 1 260px; }
  .droite { display: flex; align-items: center; gap: 16px; }
  .compteur { font-weight: 600; letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--on-dark); }
  .bande .refresh { color: var(--white); border-color: rgba(255,255,255,.7); }
  .bande .refresh:hover { color: var(--green); border-color: var(--green); }
  .bande .refresh:focus-visible { outline-color: var(--white); }

  .slider { margin-top: 32px; }
  .vue { overflow: hidden; border-radius: 16px; touch-action: pan-y; }
  .piste { list-style: none; margin: 0; padding: 0; display: flex; transition: transform .6s cubic-bezier(.22, .8, .24, 1); }
  .slide { flex: 0 0 100%; min-width: 0; display: grid; grid-template-columns: 1fr; background: var(--white); color: var(--ink); }
  .slide-media { position: relative; aspect-ratio: 2.2 / 1; background: var(--ink-2); overflow: hidden; }
  .slide-media img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
  .zoom { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .zoom:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .visuel { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink-2); }
  .visuel svg { width: 84px; height: 84px; fill: none; stroke: var(--accent-ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .visuel svg .pt { fill: var(--green); stroke: none; }
  .slide-texte { display: flex; flex-direction: column; justify-content: center; padding: 22px 22px 24px; }
  .slide h3 { margin: 0 0 8px; font-size: clamp(1.3rem, 3.4vw, 1.8rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .slide p { margin: 0 0 18px; color: var(--muted); }
  .slide-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
  .slide .btn { margin-top: 0; }
  .lien-affiche { padding: 0; background: none; border: 0; font: inherit; font-size: .92rem; font-weight: 600; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  .reperes { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
  .fleche { flex: none; width: 46px; height: 46px; display: grid; place-items: center; background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,.7); border-radius: 50%; cursor: pointer; }
  .fleche:hover { background: var(--white); color: var(--ink); }
  .fleche:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  .fleche[hidden] { display: none; }
  .fleche svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .segs { display: flex; gap: 8px; flex: 1; }
  .seg { position: relative; flex: 1; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; }
  .seg::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.28); transition: background .2s; }
  .seg.actif::before { background: var(--green); }
  .seg:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }

  /* À propos */
  .apropos-grid { display: grid; grid-template-columns: 1fr; gap: 32px; margin-top: 24px; }
  .apropos-texte p { margin: 0 0 14px; max-width: 58ch; font-size: 1.08rem; }
  .apropos-photo { margin: 0; }
  .apropos-photo img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
  .etapes-titre { margin: 48px 0 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .etapes { list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 24px; }
  .etapes li { display: grid; grid-template-columns: 40px 1fr; column-gap: 14px; align-items: start; }
  .num { width: 40px; height: 40px; display: grid; place-items: center; border: 1.5px solid var(--green-ink); border-radius: 50%; color: var(--green-ink); font-weight: 800; }
  .etapes strong { display: block; font-size: 1.05rem; }
  .etapes p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }

  /* Avis clients */
  .temoignages-titre { margin: 32px 0 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  .temoignages { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 16px; }
  .temoignage { margin: 0; padding: 22px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; }
  .temoignage blockquote { margin: 0 0 16px; }
  .temoignage blockquote p { margin: 0; font-size: 1.02rem; }
  .temoignage figcaption { font-size: .92rem; color: var(--muted); }
  .temoignage figcaption strong { color: var(--ink); }
  #avis .actions { gap: 12px; margin-top: 24px; }
  #avis .btn { margin-top: 0; }

  /* Contact */
  .contact { padding-top: 48px; border-top: 1px solid var(--line); }
  .links { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 0 40px; }
  .links li { border-top: 1px solid var(--line); }
  .links li:last-child { border-bottom: 1px solid var(--line); }
  a.link { display: grid; grid-template-columns: 44px 1fr; column-gap: 16px; align-items: center; padding: 18px 4px; color: inherit; text-decoration: none; }
  a.link:hover .name, a.link:focus-visible .name { color: var(--accent); }
  a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .icon { width: 44px; height: 44px; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .name { display: block; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; transition: color .15s; }
  .hint { display: block; color: var(--muted); font-size: .95rem; }

  .pied { margin-top: 72px; padding: 28px 0 36px; background: var(--ink); color: var(--on-dark); font-size: .88rem; }

  /* Affiche en grand (pour lire nettement les écritures) */
  .visionneuse { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; overflow: auto; background: rgba(10, 35, 66, .92); }
  .visionneuse[hidden] { display: none; }
  .visionneuse img { display: block; width: min(100%, 720px); height: auto; max-height: calc(100vh - 32px); object-fit: contain; border-radius: 10px; background: var(--white); }
  .fermer { position: fixed; top: 12px; right: 12px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--white); color: var(--ink); border: 0; border-radius: 50%; font-size: 28px; line-height: 1; cursor: pointer; }
  .fermer:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

  @media (min-width: 720px) {
    .links { grid-template-columns: 1fr 1fr; }
    .links li:nth-last-child(2):nth-child(odd) { border-bottom: 1px solid var(--line); }
    .apropos-grid.avec-photo { grid-template-columns: 1fr 300px; align-items: start; }
    .etapes { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 760px) {
    .slide { grid-template-columns: 1.35fr 1fr; }
    .slide-media { aspect-ratio: auto; min-height: 280px; }
    .slide-texte { padding: 32px; }
  }
  @media (min-width: 860px) {
    .hero { grid-template-columns: 1.3fr 1fr; }
    .deco { display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
    .refresh.loading svg { animation: none; }
  }
</style>
</head>

    var a = el("a", "btn" + (alt ? " alt" : ""));
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[icone] + '</svg>';
    a.appendChild(el("span", "", texte));
    return a;
  }

  // Charge contenu.js à neuf (jamais depuis le cache), puis appelle ok() ou erreur()
  function charger(ok, erreur) {
    var s = document.createElement("script");
    s.src = "contenu.js?t=" + Date.now();
    s.onload = function () { s.remove(); ok(); };
    s.onerror = function () { s.remove(); erreur(); };
    document.head.appendChild(s);
  }

  function lienWhatsApp(message) {
    var wa = clean(CONTACT.whatsapp).replace(/\D/g, "");
    if (!wa) return "";
    var url = "https://wa.me/" + wa;
    if (clean(message)) url += "?text=" + encodeURIComponent(message);
    return url;
  }

  // Affiche la solution numéro i (revient au début après la dernière)
  function aller(i) {
    var piste = document.getElementById("services");
    var n = piste.children.length;
    if (!n) return;
    idx = ((i % n) + n) % n;
    piste.style.transform = "translateX(" + (-100 * idx) + "%)";
    Array.prototype.forEach.call(piste.children, function (li, k) {
      li.setAttribute("aria-hidden", k === idx ? "false" : "true");
      if (k === idx) li.removeAttribute("inert"); else li.setAttribute("inert", "");
    });
    Array.prototype.forEach.call(document.getElementById("segs").children, function (b, k) {
      b.classList.toggle("actif", k === idx);
      if (k === idx) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
    document.getElementById("compteur").textContent = pad(idx + 1) + " / " + pad(n);
  }

  function render() {
    // Textes généraux
    document.title = SITE.nom + " – Solutions numériques";
    document.getElementById("nom-barre").textContent = SITE.nom;
    document.getElementById("slogan").textContent = SITE.slogan || "";
    document.getElementById("slogan").hidden = !SITE.slogan;
    document.getElementById("titre").textContent = SITE.titre;
    document.getElementById("accroche").textContent = SITE.accroche;
    document.getElementById("intro-services").textContent = SITE.introServices || "";
    document.getElementById("contact-texte").textContent = SITE.contactTexte || "";
    document.getElementById("footer-nom").textContent = SITE.nom;
    document.getElementById("year").textContent = new Date().getFullYear();

    // Points forts
    var at = document.getElementById("atouts");
    at.textContent = "";
    (SITE.atouts || []).forEach(function (a) {
      var d = el("div");
      d.appendChild(el("strong", "", a.titre));
      d.appendChild(el("p", "", a.texte));
      at.appendChild(d);
    });
    at.hidden = !(SITE.atouts && SITE.atouts.length);

    // Solutions : une diapositive par service (image large, texte, vrai bouton WhatsApp)
    var piste = document.getElementById("services");
    var segs = document.getElementById("segs");
    piste.textContent = "";
    segs.textContent = "";
    SERVICES.forEach(function (s, i) {
      var li = el("li", "slide");
      li.setAttribute("role", "group");
      li.setAttribute("aria-roledescription", "diapositive");
      li.setAttribute("aria-label", (i + 1) + " sur " + SERVICES.length);

      var media = el("div", "slide-media");
      var src = clean(s.image), aff = clean(s.affiche);
      var visuel;
      if (src) {
        visuel = document.createElement("img");
        visuel.src = imgSrc(src); visuel.alt = aff ? "" : s.titre; visuel.loading = i === 0 ? "eager" : "lazy";
      } else {
        visuel = el("div", "visuel");
        visuel.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONES_SERVICES[s.icone] || ICONES_SERVICES.web) + '</svg>';
      }
      if (aff) {
        var zoom = el("button", "zoom");
        zoom.type = "button";
        zoom.title = "Agrandir l'affiche";
        zoom.setAttribute("aria-label", "Agrandir l'affiche : " + s.titre);
        zoom.appendChild(visuel);
        zoom.addEventListener("click", ouvrirAffiche.bind(null, imgSrc(aff), s.titre, zoom));
        media.appendChild(zoom);
      } else {
        media.appendChild(visuel);
      }
      li.appendChild(media);

      var texte = el("div", "slide-texte");
      texte.appendChild(el("h3", "", s.titre));
      texte.appendChild(el("p", "", s.description));
      var actions = el("div", "slide-actions");
      var url = lienWhatsApp("Bonjour, je suis intéressé(e) par : " + s.titre + ".");
      if (url) actions.appendChild(bouton(url, "whatsapp", s.bouton || "Nous écrire sur WhatsApp"));
      if (aff) {
        var la = el("button", "lien-affiche", "Agrandir l'affiche");
        la.type = "button";
        la.addEventListener("click", ouvrirAffiche.bind(null, imgSrc(aff), s.titre, la));
        actions.appendChild(la);
      }
      texte.appendChild(actions);
      li.appendChild(texte);
      piste.appendChild(li);

      var seg = el("button", "seg");
      seg.type = "button";
      seg.setAttribute("aria-label", "Aller à : " + s.titre);
      seg.addEventListener("click", function () { aller(i); tenir(); lacher(6000); });
      segs.appendChild(seg);
    });
    var n = SERVICES.length;
    document.getElementById("solutions").hidden = !n;
    document.getElementById("prev").hidden = n < 2;
    document.getElementById("next").hidden = n < 2;
    var reglage = (typeof DEFILEMENT !== "undefined") ? DEFILEMENT : {};
    document.getElementById("pause").hidden = (reglage.auto === false || n < 2);
    if (idx >= n) idx = 0;
    aller(idx);

    // À propos (photo facultative, étapes facultatives)
    var ap = (typeof APROPOS !== "undefined") ? APROPOS : null;
    var apSection = document.getElementById("apropos");
    if (ap) {
      document.getElementById("titre-apropos").textContent = ap.titre || "À propos";
      var grid = document.getElementById("apropos-grid");
      var txt = document.getElementById("apropos-texte");
      txt.textContent = "";
      (ap.texte || []).forEach(function (t) { txt.appendChild(el("p", "", t)); });
      var vieille = grid.querySelector(".apropos-photo");
      if (vieille) vieille.remove();
      var photo = clean(ap.photo);
      grid.classList.toggle("avec-photo", !!photo);
      if (photo) {
        var fig2 = el("figure", "apropos-photo");
        var im = document.createElement("img");
        im.src = imgSrc(photo); im.alt = "Portrait de la responsable de " + SITE.nom; im.loading = "lazy";
        fig2.appendChild(im);
        grid.appendChild(fig2);
      }
      var et = document.getElementById("etapes");
      et.textContent = "";
      (ap.etapes || []).forEach(function (e, k) {
        var li = document.createElement("li");
        li.appendChild(el("span", "num", String(k + 1)));
        var d = el("div");
        d.appendChild(el("strong", "", e.titre));
        d.appendChild(el("p", "", e.texte));
        li.appendChild(d);
        et.appendChild(li);
      });
      var hasEt = ap.etapes && ap.etapes.length;
      document.getElementById("etapes-titre").textContent = hasEt ? (ap.etapesTitre || "") : "";
      document.getElementById("etapes-titre").hidden = !hasEt;
      et.hidden = !hasEt;
    }
    apSection.hidden = !(ap && ((ap.texte && ap.texte.length) || (ap.etapes && ap.etapes.length)));

    // Avis clients : témoignages, avis Google, avis par WhatsApp, réalisations
    var gAvis = clean(CONTACT.googleAvis), gProfil = clean(CONTACT.googleProfil);
    var av = (typeof AVIS !== "undefined") ? AVIS : {};
    document.getElementById("titre-avis").textContent = av.titre || "Avis clients";
    document.getElementById("avis-texte").textContent = av.texte || "";
    var tems = (av.temoignages || []).filter(function (t) { return t && clean(t.texte); });
    var tBox = document.getElementById("temoignages");
    tBox.textContent = "";
    tems.forEach(function (t) {
      var fig = el("figure", "temoignage");
      var bq = el("blockquote");
      bq.appendChild(el("p", "", "« " + clean(t.texte) + " »"));
      fig.appendChild(bq);
      var cap = el("figcaption");
      if (clean(t.nom)) cap.appendChild(el("strong", "", clean(t.nom)));
      if (clean(t.service)) cap.appendChild(document.createTextNode((clean(t.nom) ? " · " : "") + clean(t.service)));
      fig.appendChild(cap);
      tBox.appendChild(fig);
    });
    document.getElementById("temoignages-titre").textContent = tems.length ? (av.titreTemoignages || "Ils nous ont fait confiance") : "";
    document.getElementById("temoignages-titre").hidden = !tems.length;
    tBox.hidden = !tems.length;

    var avisBox = document.getElementById("avis-actions");
    avisBox.textContent = "";
    var waAvis = lienWhatsApp(av.messageWhatsapp || "Bonjour, je souhaite donner mon avis sur vos services.");
    if (gAvis) avisBox.appendChild(bouton(gAvis, "etoile", "Laisser un avis Google", false));
    if (waAvis) avisBox.appendChild(bouton(waAvis, "whatsapp", "Donner mon avis sur WhatsApp", !!gAvis));
    if (gProfil) avisBox.appendChild(bouton(gProfil, "google", "Voir nos réalisations", true));
    document.getElementById("avis").hidden = !(gAvis || waAvis || gProfil || tems.length);

    // Contact (en bas de page) : un champ vide = lien masqué
    var links = [];
    var waUrl = lienWhatsApp(CONTACT.messageWhatsapp);
    if (waUrl) links.push({ key: "whatsapp", label: "WhatsApp", hint: "Écrivez-nous directement", url: waUrl });
    var fb = clean(CONTACT.facebook);
    if (fb) links.push({ key: "facebook", label: "Facebook", hint: "Notre page et nos actualités",
      url: /^https?:\/\//i.test(fb) ? fb : "https://www.facebook.com/" + fb.replace(/^\/+/, "") });
    var ig = handle(CONTACT.instagram);
    if (ig) links.push({ key: "instagram", label: "Instagram", hint: "@" + ig, url: "https://www.instagram.com/" + ig });
    var tt = handle(CONTACT.tiktok);
    if (tt) links.push({ key: "tiktok", label: "TikTok", hint: "@" + tt, url: "https://www.tiktok.com/@" + tt });
    if (gProfil) links.push({ key: "google", label: "Google", hint: "Notre fiche et nos réalisations", url: gProfil });

    var list = document.getElementById("links");
    list.textContent = "";
    links.forEach(function (l) {
      var li = document.createElement("li");
      var a = el("a", "link");
      a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      var icon = el("span", "icon");
      icon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[l.key] + '</svg>';
      var text = el("span");
      text.appendChild(el("span", "name", l.label));
      text.appendChild(el("span", "hint", l.hint));
      a.appendChild(icon); a.appendChild(text);
      li.appendChild(a); list.appendChild(li);
    });
    document.getElementById("contact").hidden = !links.length;
  }

  // ---------- Diaporama : défilement automatique, flèches, balayage ----------
  // Le défilement démarre toujours seul. Il s'arrête au survol, au toucher, quand une affiche
  // est ouverte, et avec le bouton « Pause ». Si le téléphone limite les animations,
  // les solutions changent sans effet de glissement.
  var slider = document.getElementById("slider");
  var vue = document.getElementById("vue");
  var btnPause = document.getElementById("pause");
  var icoPause = document.getElementById("pause-ico");
  var enPause = false;
  var retenu = false, relache = null;
  var boite = document.getElementById("visionneuse");
  var boiteImg = document.getElementById("visionneuse-img");
  var boiteOuverte = false, declencheur = null;
  var x0 = null;

  function majBoutonPause() {
    icoPause.setAttribute("d", enPause ? "M8 5l11 7-11 7z" : "M9 5v14M15 5v14");
    btnPause.setAttribute("aria-label", enPause ? "Reprendre le défilement automatique" : "Mettre en pause le défilement automatique");
    document.getElementById("pause-label").textContent = enPause ? "Reprendre" : "Pause";
  }
  function tenir() { retenu = true; clearTimeout(relache); }
  function lacher(delai) { clearTimeout(relache); relache = setTimeout(function () { retenu = false; }, delai); }
  function boucle() {
    var r = (typeof DEFILEMENT !== "undefined") ? DEFILEMENT : {};
    setTimeout(function () {
      var r2 = (typeof DEFILEMENT !== "undefined") ? DEFILEMENT : {};
      if (r2.auto !== false && !enPause && !retenu && !boiteOuverte && !document.hidden) aller(idx + 1);
      boucle();
    }, Math.max(1500, (r.secondes || 4) * 1000));
  }

  // Affiche en grand pour lire nettement les écritures
  function ouvrirAffiche(src, titre, source) {
    declencheur = source;
    boiteImg.src = src;
    boiteImg.alt = "Affiche : " + titre;
    boite.hidden = false;
    boiteOuverte = true;
    document.body.style.overflow = "hidden";
    document.getElementById("fermer").focus();
  }
  function fermerAffiche() {
    if (!boiteOuverte) return;
    boite.hidden = true;
    boiteOuverte = false;
    document.body.style.overflow = "";
    if (declencheur) declencheur.focus();
    tenir(); lacher(2000);
  }
  document.getElementById("fermer").addEventListener("click", fermerAffiche);
  boite.addEventListener("click", function (e) { if (e.target === boite) fermerAffiche(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") fermerAffiche();
  });

  slider.addEventListener("mouseenter", tenir);
  slider.addEventListener("mouseleave", function () { lacher(500); });
  slider.addEventListener("focusin", tenir);
  slider.addEventListener("focusout", function () { lacher(500); });
  slider.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { aller(idx + 1); e.preventDefault(); }
    if (e.key === "ArrowLeft") { aller(idx - 1); e.preventDefault(); }
  });

  // Balayage au doigt : gauche = suivant, droite = précédent
  vue.addEventListener("pointerdown", function (e) { if (e.pointerType === "mouse") return; x0 = e.clientX; tenir(); });
  vue.addEventListener("pointerup", function (e) {
    if (e.pointerType === "mouse" || x0 === null) return;
    var dx = e.clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 40) aller(idx + (dx < 0 ? 1 : -1));
    lacher(6000);
  });
  vue.addEventListener("pointercancel", function () { x0 = null; lacher(6000); });

  document.getElementById("prev").addEventListener("click", function () { aller(idx - 1); tenir(); lacher(6000); });
  document.getElementById("next").addEventListener("click", function () { aller(idx + 1); tenir(); lacher(6000); });
  btnPause.addEventListener("click", function () { enPause = !enPause; majBoutonPause(); });
  majBoutonPause();
  boucle();

  // ---------- Bouton « Actualiser » ----------
  var btn = document.getElementById("refresh");
  var label = document.getElementById("refresh-label");
  var status = document.getElementById("status");

  function fin() { btn.disabled = false; btn.classList.remove("loading"); label.textContent = "Actualiser"; }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    btn.classList.add("loading");
    label.textContent = "Actualisation…";
    status.textContent = "";
    imageStamp = String(Date.now());
    charger(function () {
      render();
      fin();
      status.textContent = "À jour à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }, function () {
      fin();
      status.textContent = "Échec : vérifiez votre connexion.";
    });
  });

  // Premier affichage
  charger(render, function () {
    document.getElementById("accroche").textContent = "Le contenu n'a pas pu être chargé. Touchez « Actualiser » pour réessayer.";
  });
</script>
</body>
</html>
